    <ellipse cx="-52" cy="800" rx="40" ry="46" fill="#fff"/><ellipse cx="52" cy="800" rx="40" ry="46" fill="#fff"/>

   <ellipse cx="-104" cy="872" rx="18" ry="10" fill="#ff8fb0" opacity=".45"/><ellipse cx="104" cy="872" rx="18" ry="10" fill="#ff8fb0" opacity=".45"/>

<div id="top"><div class="brand">Gem<span>Easy</span> Studio</div><div class="chip">GeM KI KAHANI · CHAPTER 1</div><div class="title">GeM kya hai, aur<br>mere liye kyun?</div></div>
<div id="sub"><div id="tag">RAMESH</div><div id="txt"></div></div>
<div id="disc">Characters are fictional · AI-generated voice · GemEasy is an independent consultancy, not affiliated with GeM or the Government of India</div>
<div id="end"><div class="a">Next on GeM Ki Kahani</div><div class="b">Chapter 2: Registration mein atak gaya</div><div class="c">Follow GemEasy</div></div>
<script>
let T=null;
const $=id=>document.getElementById(id);
function render(i){
 const fps=T.fps,t=i/fps,env=T.env[i]||0;
 let seg=T.segs.find(s=>t>=s.start-0.05&&t<=s.end+0.3)||null;
 let last=T.segs.filter(s=>s.start<=t).pop()||T.segs[0];
 const sp=seg?seg.who:null;
 const mG=sp==='G'?env:0, mR=sp==='R'?env:0;
 // gem mouth
 $('gMouth').setAttribute('ry',6+mG*34); $('gMouth').setAttribute('rx',34-mG*6);
 $('gTongue').setAttribute('ry',mG*12); $('gTongue').setAttribute('cy',890+mG*22);
 $('gSmile').style.opacity=mG<0.06?1:0;$('gMouthG').style.opacity=mG<0.06?0:1;
 $('rMouth').setAttribute('ry',4+mR*20);
 // bob
 const bg=Math.sin(t*2.2)*6+(sp==='G'?Math.sin(t*9)*2*mG:0), br=Math.sin(t*1.8+1)*4;
 $('gem').setAttribute('transform',`translate(760,${bg})`);
 $('rHead').setAttribute('transform',`translate(0,${br}) rotate(${sp==='R'?Math.sin(t*3)*3:0} 0 900)`);
 // arms gesture
 const ga=sp==='G'?(-55+Math.sin(t*2.5)*18):Math.sin(t*1.5)*4;
 $('gArmR').setAttribute('transform',`rotate(${ga} 150 900)`);
 $('gArmL').setAttribute('transform',`rotate(${sp==='G'?Math.sin(t*2)*8:0} -150 900)`);
 $('rArmR').setAttribute('transform',`rotate(${sp==='R'?(-35+Math.sin(t*3)*12):0} 112 980)`);
 // brows
 $('gBrowL').setAttribute('transform',`translate(0,${-mG*8})`);$('gBrowR').setAttribute('transform',`translate(0,${-mG*8})`);
 const worry=sp==='R'?-6:0; $('rBrowL').setAttribute('transform',`rotate(${-worry} -44 750)`);$('rBrowR').setAttribute('transform',`rotate(${worry} 44 750)`);
 // eyes look at speaker
 const lx=sp==='R'?-8:(sp==='G'?0:-4); $('pL').setAttribute('cx',-46+lx); $('pR').setAttribute('cx',58+lx);
 // blink
 const bp=(t%3.7), bl=bp<0.14?Math.sin(bp/0.14*Math.PI):0;
 $('lidL').setAttribute('height',bl*96);$('lidR').setAttribute('height',bl*96);
 const rb=((t+1.3)%4.1)<0.12?1:0; $('rEyes').setAttribute('transform',rb?'translate(0,805) scale(1,.1) translate(0,-805)':'');
 // spots
 $('spotG').setAttribute('opacity',sp==='G'?.22:.1);$('spotR').setAttribute('opacity',sp==='R'?.22:.1);
 // subtitle
 const s=seg||last; $('txt').textContent=s.sub;
 const isG=s.who==='G'; $('tag').textContent=isG?'MR. GEMEASY':'RAMESH GUPTA · Furniture maker, Patna'; $('tag').style.background=isG?'#1b63c6':'#8c2f39';
 $('sub').style.opacity=seg?1:0.85;
 $('end').style.display=t>T.dur-1.15?'block':'none';
}
</script></body></html>
